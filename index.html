
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Barcode skaner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      text-align: center;
      background: #f5f5f5;
    }
    main {
      max-width: 440px;
      margin: auto;
      background: white;
      padding: 18px;
      border-radius: 14px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      font-size: 17px;
      border: 0;
      border-radius: 8px;
      background: #1769aa;
      color: white;
    }
    #reader {
      width: 100%;
      margin-top: 15px;
    }
    #status {
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
<main>
  <h2>📷 Barcode skaner</h2>
  <p>Orqa kamerani yoqing va mahsulot shtrix-kodini ko‘rsating.</p>
  <button id="start" onclick="startScanner()">Kamerani yoqish</button>
  <button id="stop" onclick="stopScanner()">To‘xtatish</button>
  <div id="reader"></div>
  <p id="status">Kamera ishga tushirishga tayyor.</p>
  <div id="result"></div>
</main>

<script>
let scanner = null;
let busy = false;
let finished = false;

function status(text) {
  document.getElementById("status").textContent = text;
}

async function startScanner() {
  if (busy) return;

  if (!window.isSecureContext) {
    status("XATO: Sahifa HTTPS orqali ochilishi kerak.");
    return;
  }

  if (typeof Html5Qrcode === "undefined") {
    status("XATO: Skaner kutubxonasi yuklanmadi. Internetni tekshiring.");
    return;
  }

  busy = true;
  finished = false;
  document.getElementById("result").textContent = "";
  status("Kamera ishga tushirilmoqda...");

  try {
    scanner = new Html5Qrcode("reader");

    await scanner.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: { width: 280, height: 140 },
        formatsToSupport: [
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E,
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.ITF
        ]
      },
      (code) => {
        if (finished) return;
        finished = true;
        status("Topildi: " + code);
        sendBarcode(code);
      },
      () => {}
    );

    status("Kamera ishlayapti. Barcode’ni ko‘rsating.");
  } catch (e) {
    busy = false;
    status("KAMERA XATOSI: " + (e.message || e));
  }
}

async function stopScanner() {
  try {
    if (scanner && scanner.isScanning) {
      await scanner.stop();
    }
    if (scanner) {
      await scanner.clear();
    }
  } catch (e) {
    // Kamera to‘xtatilganda xato bo‘lsa, sahifa ishlashda davom etadi.
  }

  scanner = null;
  busy = false;
  status("Skaner to‘xtatildi.");
}

async function sendBarcode(code) {
  await stopScanner();
  status("Barcode topildi: " + code);

  if (window.opener && !window.opener.closed) {
  window.opener.postMessage(
    { type: "barcode-scanned", barcode: code },
    "*"
  );

  status("Barcode savdo tizimiga yuborildi: " + code);
  return;
}
  }

  document.getElementById("result").innerHTML = "";

  const output = document.createElement("p");
  output.textContent = "Barcode: " + code;
  document.getElementById("result").appendChild(output);

  const copy = document.createElement("button");
  copy.textContent = "Barcode’ni nusxalash";
  copy.onclick = async () => {
    try {
      await navigator.clipboard.writeText(code);
      status("Barcode nusxalandi: " + code);
    } catch (e) {
      status("Barcode: " + code);
    }
  };
  document.getElementById("result").appendChild(copy);
}
</script>
</body>
</html>
